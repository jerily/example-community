# Site defaults. Override selected values with --config /path/to/site.ini.
[site]
port = 8080
tenant = community
site_name = Juniper Yard
origin = http://localhost:8080
listen_host = 127.0.0.1
num_threads = 1
home_path = /a-little-space-to-grow
sqlite_path = data/community.sqlite3
key_file = data/community.keyset
master_template_file = assets/page.html.jinja

[account]
# Sample for local development. Generate a private site value with openssl rand -hex 32.
# Set it once in your private --config file and retain across restarts.
email_hash_salt = 75a3ed41e3a2eaa2e9d0c227b6866ded905389043c5b08023c29328b8538d93f
bcrypt_cost = 12
password_min_length = 6
collect_names = true
totp_digits = 6
totp_period = 30
totp_algorithm = SHA1
totp_window = 1
session_ttl = 43200
code_ttl = 900
challenge_ttl = 600
throttle_window = 900
browse_limit = 120
post_limit = 60
account_limit = 10
challenge_limit = 5
form_max_bytes = 32768

[user]
prefix = /user
deliver =

[forum]
prefix = /forum
title = Discussions
page_size = 100
body_max_length = 10000
title_max_length = 160
post_limit = 30

[wiki]
allow_create = true

[blog]
allow_create = true

[server]
max_request_read_bytes = 4259840
gzip = off

# Fill these in a separate deployment file; keep credentials out of this file.
[postgresql]
host =
port =
database =
user =
password =
sslmode =
